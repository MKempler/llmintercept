<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation - LLM Intercept</title>
    <meta name="description" content="Complete documentation for LLM Intercept - integration guides, API reference, and setup instructions.">
    <link rel="icon" type="image/png" href="logo.png">
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LKJ51BJ5DG"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-LKJ51BJ5DG');
    </script>
    
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    
    <!-- Prism.js for code highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    
    <style>
        /* Override Prism theme to match our dark theme */
        pre[class*="language-"] {
            background: var(--dark-surface) !important;
            border: 1px solid var(--gray-border) !important;
        }
        code[class*="language-"] {
            color: var(--text-secondary) !important;
        }
        :root {
            --primary: #2563EB;
            --primary-dark: #1d4ed8;
            --primary-light: #3b82f6;
            --secondary: #64748b;
            --accent: #22D3EE;
            --success: #059669;
            --warning: #F97316;
            --error: #F43F5E;
            --dark: #0f172a;
            --dark-light: #1e293b;
            --dark-surface: #334155;
            --gray: #9CA3AF;
            --gray-light: var(--dark-surface);
            --gray-border: rgba(148, 163, 253, 0.2);
            --white: var(--dark-surface);
            --text-primary: #F9FAFB;
            --text-secondary: #E5E7EB;
            --text-muted: #9CA3AF;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro", sans-serif;
            line-height: 1.6;
            color: var(--text-secondary);
            background: var(--dark);
            overflow-x: hidden;
            font-size: 16px;
            font-weight: 400;
        }

        /* Header */
        header {
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.3), 0 1px 2px 0 rgba(0, 0, 0, 0.2);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-bottom: 1px solid var(--gray-border);
        }

        header.scrolled {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
            background: rgba(15, 23, 42, 0.95);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.125rem 0;
            max-width: 1400px;
            margin: 0 auto;
            padding-left: 24px;
            padding-right: 24px;
            gap: 2rem;
        }

        nav > .nav-links {
            flex: 1;
            justify-content: center;
            margin: 0;
            padding: 0;
        }

        .logo {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.03em;
            display: flex;
            align-items: center;
            gap: 0.875rem;
            transition: all 0.3s ease;
            text-decoration: none;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro", sans-serif;
        }

        .logo:hover {
            transform: translateY(-1px);
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: transparent;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        .logo-text {
            display: flex;
            align-items: baseline;
            gap: 0.25rem;
        }

        .logo-accent {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 50%, #60a5fa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .logo-text .logo-name {
            color: var(--text-primary);
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9375rem;
            transition: color 0.2s ease;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .nav-links a.active {
            color: var(--primary);
        }

        .nav-links a.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--primary);
            border-radius: 1px;
        }

        /* Main Layout */
        .docs-container {
            display: flex;
            min-height: calc(100vh - 80px);
            margin-top: 80px;
        }

        /* Sidebar */
        .docs-sidebar {
            width: 260px;
            background: var(--dark);
            border-right: 1px solid var(--gray-border);
            padding: 0;
            position: fixed;
            left: 0;
            top: 80px;
            height: calc(100vh - 80px);
            overflow-y: auto;
            z-index: 100;
        }

        .docs-sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .docs-sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .docs-sidebar::-webkit-scrollbar-thumb {
            background: var(--gray-border);
            border-radius: 3px;
        }

        .docs-sidebar::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        .sidebar-search {
            padding: 1.25rem 1.25rem 1rem;
            border-bottom: 1px solid var(--gray-border);
            background: var(--dark-light);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .sidebar-search input {
            width: 100%;
            padding: 0.625rem 0.875rem;
            background: var(--dark-surface);
            border: 1px solid var(--gray-border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.8125rem;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .sidebar-search input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
            background: var(--dark-surface);
        }

        .sidebar-search input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        .sidebar-nav {
            padding: 1rem 0;
        }


        .sidebar-nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .sidebar-nav li {
            margin: 0;
        }

        .sidebar-nav a {
            display: block;
            padding: 0.5rem 1.25rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            transition: all 0.15s ease;
            line-height: 1.5;
            border-left: 3px solid transparent;
            position: relative;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal;
        }

        .sidebar-nav a:hover {
            background: rgba(37, 99, 235, 0.05);
            color: var(--text-primary);
            border-left-color: var(--primary);
        }

        .sidebar-nav a.active {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
            font-weight: 500;
            border-left-color: var(--primary);
        }

        /* Main Content */
        .docs-main {
            flex: 1;
            margin-left: 260px;
            padding: 3rem 3rem;
            max-width: calc(100% - 260px);
        }

        .docs-content {
            max-width: 800px;
            margin: 0 auto;
        }

        .docs-content h1 {
            font-size: 2.25rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1.5rem;
            margin-top: 0;
            line-height: 1.3;
            letter-spacing: -0.02em;
        }

        .docs-content h2 {
            font-size: 1.625rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-top: 3rem;
            margin-bottom: 1.25rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--gray-border);
            scroll-margin-top: 100px;
            line-height: 1.4;
            letter-spacing: -0.01em;
        }

        .docs-content h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .docs-content h4 {
            font-size: 1.0625rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-top: 2rem;
            margin-bottom: 0.75rem;
            line-height: 1.5;
        }

        .docs-content p {
            margin-bottom: 1.5rem;
            line-height: 1.75;
            color: var(--text-secondary);
        }

        .docs-content ul,
        .docs-content ol {
            margin-bottom: 1.5rem;
            padding-left: 1.75rem;
        }

        .docs-content li {
            margin-bottom: 0.75rem;
            line-height: 1.75;
            color: var(--text-secondary);
        }

        .docs-content ul li::marker {
            color: var(--primary);
        }

        .docs-content ul li:has(> strong:first-child) {
            margin-bottom: 1rem;
        }

        .docs-content code {
            background: var(--dark-surface);
            padding: 0.2em 0.4em;
            border-radius: 4px;
            font-size: 0.9em;
            font-family: 'Courier New', 'Monaco', 'Menlo', monospace;
            color: var(--accent);
            border: 1px solid var(--gray-border);
        }

        .docs-content pre {
            background: var(--dark-surface);
            border: 1px solid var(--gray-border);
            border-radius: 10px;
            padding: 1.5rem;
            overflow-x: auto;
            margin-bottom: 2rem;
            margin-top: 1.5rem;
        }

        .docs-content pre code {
            background: transparent;
            padding: 0;
            border: none;
            color: var(--text-secondary);
            font-size: 0.875rem;
            line-height: 1.6;
        }

        .docs-content blockquote {
            border-left: 3px solid var(--primary);
            margin: 2rem 0;
            color: var(--text-muted);
            font-style: italic;
            background: rgba(37, 99, 235, 0.05);
            padding: 1rem 1.5rem;
            border-radius: 0 8px 8px 0;
        }

        .docs-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 2rem 0;
            border: 1px solid var(--gray-border);
            border-radius: 8px;
            overflow: hidden;
        }

        .docs-content table th,
        .docs-content table td {
            padding: 0.875rem 1rem;
            border: 1px solid var(--gray-border);
            text-align: left;
        }

        .docs-content table th {
            background: var(--dark-surface);
            font-weight: 600;
            color: var(--text-primary);
        }

        .docs-content table tr:nth-child(even) {
            background: rgba(51, 65, 85, 0.3);
        }

        .docs-content a {
            color: var(--primary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .docs-content a:hover {
            color: var(--primary-light);
            text-decoration: underline;
        }

        .docs-content hr {
            border: none;
            border-top: 1px solid var(--gray-border);
            margin: 3rem 0;
        }

        .docs-content strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Loading State */
        .docs-loading {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        .docs-error {
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.3);
            border-radius: 8px;
            padding: 1.5rem;
            margin: 2rem 0;
            color: var(--error);
        }

        /* Search Results */
        .search-results {
            display: none;
            margin-top: 0.75rem;
            max-height: 400px;
            overflow-y: auto;
        }

        .search-results.active {
            display: block;
        }

        .search-result-item {
            padding: 0.75rem 1rem;
            margin-bottom: 0.375rem;
            background: var(--dark-surface);
            border: 1px solid var(--gray-border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .search-result-item:hover {
            border-color: var(--primary);
            background: rgba(37, 99, 235, 0.08);
        }

        .search-result-item h4 {
            color: var(--primary);
            font-size: 0.8125rem;
            font-weight: 600;
            margin: 0 0 0.375rem 0;
        }

        .search-result-item p {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin: 0;
            line-height: 1.4;
        }

        .search-highlight {
            background: rgba(37, 99, 235, 0.2);
            padding: 0.1em 0.2em;
            border-radius: 3px;
        }

        /* Mobile Responsive */
        .sidebar-toggle {
            display: none;
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 56px;
            height: 56px;
            background: var(--primary);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 1001;
            box-shadow: var(--shadow-lg);
            transition: all 0.3s ease;
        }

        .sidebar-toggle:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-xl);
        }

        @media (max-width: 1024px) {
            .docs-sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }

            .docs-sidebar.open {
                transform: translateX(0);
            }

            .docs-main {
                margin-left: 0;
                max-width: 100%;
                padding: 2rem 1.5rem;
            }

            .docs-sidebar {
                width: 260px;
            }

            .sidebar-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            .docs-content h1 {
                font-size: 2rem;
            }

            .docs-content h2 {
                font-size: 1.5rem;
            }

            .docs-content {
                padding: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header id="header">
        <nav>
            <a href="index.html" class="logo">
                <div class="logo-icon">
                    <img src="logo.png" alt="LLM Intercept Logo">
                </div>
                <div class="logo-text">
                    <span class="logo-name">LLM</span>
                    <span class="logo-accent">Intercept</span>
                </div>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#interactive-demo">Demo</a></li>
                <li><a href="index.html#dashboard-preview">Dashboard</a></li>
                <li><a href="index.html#use-cases">Use Cases</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Docs Container -->
    <div class="docs-container">
        <!-- Sidebar -->
        <aside class="docs-sidebar" id="sidebar">
            <div class="sidebar-search">
                <input type="text" id="searchInput" placeholder="Search documentation...">
                <div class="search-results" id="searchResults"></div>
            </div>
            <nav class="sidebar-nav" id="sidebarNav">
                <ul id="docsList"></ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="docs-main">
            <div class="docs-content" id="docsContent">
                <div class="docs-loading">Loading documentation...</div>
            </div>
        </main>
    </div>

    <!-- Mobile Sidebar Toggle -->
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">☰</button>

    <script>
        // Documentation files
        const docsFiles = [
            { name: 'Customer Onboarding', file: 'CUSTOMER_ONBOARDING.md', description: 'Complete onboarding guide' },
            { name: 'SDK Quick Start', file: 'SDK_QUICKSTART.md', description: 'Get started with the SDK' },
            { name: 'SDK Integration Guide', file: 'SDK_INTEGRATION_GUIDE.md', description: 'Detailed SDK integration' },
            { name: 'Gateway Integration', file: 'GATEWAY_INTEGRATION.md', description: 'Gateway proxy setup' },
            { name: 'Gateway Deployment', file: 'GATEWAY_DEPLOYMENT.md', description: 'Deploy the gateway' },
            { name: 'Gateway Configuration', file: 'GATEWAY_CONFIGURATION.md', description: 'Configure the gateway' }
        ];

        // Get page from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const pageParam = urlParams.get('page') || 'CUSTOMER_ONBOARDING.md';

        // Current page state
        let currentPage = pageParam;
        let allDocsContent = {};

        // Initialize marked with options
        marked.setOptions({
            breaks: true,
            gfm: true,
            headerIds: true,
            mangle: false
        });

        // Load documentation file
        async function loadDoc(filename) {
            try {
                const response = await fetch(`docs/${filename}`);
                if (!response.ok) {
                    throw new Error(`Failed to load ${filename}`);
                }
                const markdown = await response.text();
                const html = marked.parse(markdown);
                
                // Store content for search
                allDocsContent[filename] = {
                    markdown,
                    html,
                    name: docsFiles.find(d => d.file === filename)?.name || filename
                };

                // Render content
                document.getElementById('docsContent').innerHTML = html;
                
                // Highlight code blocks
                Prism.highlightAll();

                // Update active nav item
                updateActiveNav(filename);

                // Update URL without reload
                window.history.pushState({}, '', `docs.html?page=${filename}`);

                // Scroll to top
                window.scrollTo(0, 0);
            } catch (error) {
                document.getElementById('docsContent').innerHTML = 
                    `<div class="docs-error">Error loading documentation: ${error.message}</div>`;
            }
        }

        // Build sidebar navigation
        function buildSidebar() {
            const docsList = document.getElementById('docsList');
            docsList.innerHTML = docsFiles.map(doc => `
                <li>
                    <a href="#" data-file="${doc.file}" class="doc-link">
                        ${doc.name}
                    </a>
                </li>
            `).join('');

            // Add click handlers
            document.querySelectorAll('.doc-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const filename = e.target.getAttribute('data-file');
                    currentPage = filename;
                    loadDoc(filename);
                });
            });
        }

        // Update active nav item
        function updateActiveNav(filename) {
            document.querySelectorAll('.doc-link').forEach(link => {
                if (link.getAttribute('data-file') === filename) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        }

        // Search functionality
        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim().toLowerCase();
            
            if (query.length < 2) {
                document.getElementById('searchResults').classList.remove('active');
                return;
            }

            searchTimeout = setTimeout(() => {
                performSearch(query);
            }, 300);
        });

        // Perform search across all docs
        async function performSearch(query) {
            const results = [];
            
            // Load all docs if not already loaded
            for (const doc of docsFiles) {
                if (!allDocsContent[doc.file]) {
                    try {
                        const response = await fetch(`docs/${doc.file}`);
                        if (response.ok) {
                            const markdown = await response.text();
                            allDocsContent[doc.file] = {
                                markdown,
                                name: doc.name
                            };
                        }
                    } catch (error) {
                        console.error(`Error loading ${doc.file}:`, error);
                    }
                }
            }

            // Search through all docs
            for (const [filename, content] of Object.entries(allDocsContent)) {
                const lines = content.markdown.split('\n');
                lines.forEach((line, index) => {
                    if (line.toLowerCase().includes(query)) {
                        const docName = docsFiles.find(d => d.file === filename)?.name || filename;
                        const context = line.substring(0, 150);
                        results.push({
                            filename,
                            docName,
                            line: index + 1,
                            context: highlightSearchTerm(context, query)
                        });
                    }
                });
            }

            // Display results
            displaySearchResults(results, query);
        }

        // Highlight search term in text
        function highlightSearchTerm(text, query) {
            const regex = new RegExp(`(${query})`, 'gi');
            return text.replace(regex, '<span class="search-highlight">$1</span>');
        }

        // Display search results
        function displaySearchResults(results, query) {
            const resultsContainer = document.getElementById('searchResults');
            
            if (results.length === 0) {
                resultsContainer.innerHTML = '<div class="search-result-item"><p>No results found</p></div>';
                resultsContainer.classList.add('active');
                return;
            }

            resultsContainer.innerHTML = results.slice(0, 10).map(result => `
                <div class="search-result-item" data-file="${result.filename}">
                    <h4>${result.docName}</h4>
                    <p>${result.context}</p>
                </div>
            `).join('');

            // Add click handlers to results
            resultsContainer.querySelectorAll('.search-result-item').forEach(item => {
                item.addEventListener('click', () => {
                    const filename = item.getAttribute('data-file');
                    currentPage = filename;
                    loadDoc(filename);
                    document.getElementById('searchInput').value = '';
                    resultsContainer.classList.remove('active');
                });
            });

            resultsContainer.classList.add('active');
        }

        // Mobile sidebar toggle
        document.getElementById('sidebarToggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
        });

        // Close sidebar when clicking outside on mobile
        document.addEventListener('click', (e) => {
            const sidebar = document.getElementById('sidebar');
            const toggle = document.getElementById('sidebarToggle');
            if (window.innerWidth <= 1024 && 
                !sidebar.contains(e.target) && 
                !toggle.contains(e.target) &&
                sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
            }
        });

        // Header scroll effect
        window.addEventListener('scroll', () => {
            const header = document.getElementById('header');
            if (window.scrollY > 10) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        // Initialize
        buildSidebar();
        loadDoc(currentPage);
    </script>
</body>
